[package]
name = "attend"
description = "A classroom attendance tracking CLI"
license = "MIT"
homepage = "https://github.com/oseda-dev/attend"
repository = "https://github.com/oseda-dev/attend"
readme = "README.md"
version = "0.2.1"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
mime_guess = "2.0"
yew = { version = "0.21", features = ["csr"] }
include_dir = "0.7.4"
qrcode = "0.14.1"
image = "0.25.10"
serde = "1.0.228"
shellexpand = "3.1.2"
inquire = { version = "0.9.4", features = ["date"] }
chrono = "0.4.44"
derive_more = { version = "2.1.1", features = ["full"] }
local-ip-address = "0.6.11"
dirs = "6.0.0"
open = "5.3.3"
