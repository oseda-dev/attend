<!-- doing this all in one file so its easier to template -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Signup</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 0.5rem;
            color: #333;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="email"] {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            border-color: #2ecc71;
        }

        button {
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #27ae60;
        }

        .session-info {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #999;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- this will get templated out -->
        <h2>Record your attendance for {{ DATE }} </h2>
        <p>Enter your email</p>
        
        <form id="signupForm" class="form-group">
            <!-- im hard coding this placeholder to be wright.edu, if someone else wants to ever uses this, feel free to adjust -->
            <input type="email" id="emailInput" placeholder="name@wright.edu" required>
            <button type="submit">Submit</button>
        </form>

        <div class="session-info">
            Session ID: <span id="sessionIdDisplay"></span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sessionKey = 'session_id';
            let sessionId = localStorage.getItem(sessionKey);
            //  generate or retrieve session ID

            if (!sessionId) {
                // crib session id if found
                // does incorporate todays date, which I could see being a problem at some point?
                sessionId = 'sess_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
                localStorage.setItem(sessionKey, sessionId);
            }

            document.getElementById('sessionIdDisplay').textContent = sessionId;

            const form = document.getElementById('signupForm');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('emailInput').value;
                
                console.log('email was', email);
                console.log('sesion id was:', sessionId);
                
                // post to backend here eventually

                fetch('http://{{ SOCKET }}/record', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        id: sessionId,
                        email: email,
                    }),
                })
                .then(response => response.json()) 
                .then(data => console.log('Success:', data))
                .catch(error => console.error('Error:', error));

            });
        });
    </script>
</body>
</html>
